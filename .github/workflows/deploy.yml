name: Deploy to AWS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      client:
        description: 'Client to deploy for'
        required: true
        default: 'default'

env:
  AWS_REGION: us-east-1
  CLIENT_NAME: ${{ github.event.inputs.client || 'default' }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Validate CloudFormation template
        run: |
          aws cloudformation validate-template \
            --template-body file://infra/cloudformation/main.yaml
      
      - name: Deploy Infrastructure
        run: |
          aws cloudformation deploy \
            --template-file infra/cloudformation/main.yaml \
            --stack-name ${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-ecommerce-stack \
            --parameter-overrides \
              Environment=${{ env.ENVIRONMENT }} \
              DatabaseUsername=${{ secrets.DB_USERNAME }} \
              DatabasePassword=${{ secrets.DB_PASSWORD }} \
              GoogleClientId=${{ secrets.GOOGLE_CLIENT_ID }} \
              GoogleClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --capabilities CAPABILITY_IAM \
            --tags Client=${{ env.CLIENT_NAME }} Environment=${{ env.ENVIRONMENT }}

  backend:
    name: Deploy Backend
    needs: infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
          
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Build and Test
        run: |
          cd backend
          dotnet restore
          dotnet build --configuration Release
          dotnet test --configuration Release --no-build
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-backend:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Get CloudFormation outputs
        id: cloudformation
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-ecommerce-stack \
            --query "Stacks[0].Outputs" \
            --output json > cf-outputs.json
          echo "::set-output name=cluster::$(cat cf-outputs.json | jq -r '.[] | select(.OutputKey=="ECSClusterName") | .OutputValue')"
          
      - name: Deploy to ECS
        run: |
          TASK_DEFINITION=$(aws ecs register-task-definition \
            --family ${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-backend \
            --network-mode awsvpc \
            --requires-compatibilities FARGATE \
            --cpu 512 \
            --memory 1024 \
            --execution-role-arn arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/ecsTaskExecutionRole \
            --container-definitions '[{
              "name": "backend",
              "image": "${{ steps.login-ecr.outputs.registry }}/${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-backend:${{ github.sha }}",
              "essential": true,
              "portMappings": [{
                "containerPort": 80,
                "hostPort": 80,
                "protocol": "tcp"
              }],
              "environment": [
                {
                  "name": "ASPNETCORE_ENVIRONMENT",
                  "value": "${{ env.ENVIRONMENT }}"
                },
                {
                  "name": "GoogleClientId",
                  "value": "${{ secrets.GOOGLE_CLIENT_ID }}"
                }
              ],
              "secrets": [
                {
                  "name": "GoogleClientSecret",
                  "valueFrom": "arn:aws:ssm:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:parameter/${{ env.ENVIRONMENT }}/${{ env.CLIENT_NAME }}/google/client-secret"
                },
                {
                  "name": "ConnectionStrings__DefaultConnection",
                  "valueFrom": "arn:aws:ssm:${{ env.AWS_REGION }}:${{ secrets.AWS_ACCOUNT_ID }}:parameter/${{ env.ENVIRONMENT }}/${{ env.CLIENT_NAME }}/db-connection"
                }
              ],
              "logConfiguration": {
                "logDriver": "awslogs",
                "options": {
                  "awslogs-group": "/ecs/${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-backend",
                  "awslogs-region": "${{ env.AWS_REGION }}",
                  "awslogs-stream-prefix": "ecs"
                }
              }
            }]' \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
            
          aws ecs update-service \
            --cluster ${{ steps.cloudformation.outputs.cluster }} \
            --service ${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-backend-service \
            --task-definition $TASK_DEFINITION \
            --force-new-deployment

  frontend:
    name: Deploy Frontend
    needs: [infrastructure, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          
      - name: Get CloudFormation outputs
        id: cloudformation
        run: |
          aws cloudformation describe-stacks \
            --stack-name ${{ env.ENVIRONMENT }}-${{ env.CLIENT_NAME }}-ecommerce-stack \
            --query "Stacks[0].Outputs" \
            --output json > cf-outputs.json
          echo "::set-output name=s3Bucket::$(cat cf-outputs.json | jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue')"
          echo "::set-output name=cloudfront::$(cat cf-outputs.json | jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue')"
          echo "::set-output name=backendUrl::$(cat cf-outputs.json | jq -r '.[] | select(.OutputKey=="CloudFrontDomainName") | .OutputValue')"
              
      - name: Create env file
        run: |
          cat > frontend/.env.production << EOF
          VITE_API_URL=https://${{ steps.cloudformation.outputs.backendUrl }}/api
          VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_APP_ENV=${{ env.ENVIRONMENT }}
          EOF
          
      - name: Install dependencies
        run: cd frontend && npm ci
        
      - name: Build
        run: cd frontend && npm run build
        
      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist s3://${{ steps.cloudformation.outputs.s3Bucket }} --delete
          
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ steps.cloudformation.outputs.cloudfront }} \
            --paths "/*" 